name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: pip install -r requirements-ci.txt

      # The tests stub Qdrant, the reranker, the LLM gateway and the planner, so no API keys,
      # no torch and no .env are needed. Retrieval quality is guarded by tests that check the
      # committed results in evals/results/ against the current gold labels.
      - name: Run tests
        env:
          LOGFIRE_IGNORE_NO_CONFIG: "1"
        run: python -m pytest tests -q
